<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Titulación — Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="page-bg"></div>

    <header class="site-header">
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">🎓</span>
                <span class="logo-text">DiplomasWeb</span>
            </div>
            <nav class="header-nav">
                <a href="index.html" class="nav-link active">Registro</a>
                <a href="admin.html" class="nav-link">Panel Admin</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="form-card">

            <div class="form-header">
                <p class="form-eyebrow">Universidad — Titulación</p>
                <h1 class="form-title">Registro de<br>Diploma Profesional</h1>
                <p class="form-subtitle">Complete el formulario para generar el certificado de titulación con código QR de verificación.</p>
            </div>

            <form id="formTitulacion" novalidate>

                <div class="form-section">
                    <h3 class="section-title">Datos del Estudiante</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nombre">Nombre(s) <span class="required">*</span></label>
                            <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Carlos" required autocomplete="off">
                            <span class="field-error" id="err-nombre"></span>
                        </div>
                        <div class="form-group">
                            <label for="apellidos">Apellidos <span class="required">*</span></label>
                            <input type="text" id="apellidos" name="apellidos" placeholder="Ej: García López" required autocomplete="off">
                            <span class="field-error" id="err-apellidos"></span>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="dni">DNI <span class="required">*</span></label>
                            <input type="text" id="dni" name="dni" placeholder="12345678" maxlength="8" required>
                            <span class="field-hint">8 dígitos numéricos</span>
                            <span class="field-error" id="err-dni"></span>
                        </div>
                        <div class="form-group">
                            <label for="fecha">Fecha de Titulación <span class="required">*</span></label>
                            <input type="date" id="fecha" name="fecha" required>
                            <span class="field-error" id="err-fecha"></span>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3 class="section-title">Información Académica</h3>
                    <div class="form-group">
                        <label for="carrera">Carrera Profesional <span class="required">*</span></label>
                        <input type="text" id="carrera" name="carrera" placeholder="Ej: Ingeniería de Sistemas" required>
                        <span class="field-error" id="err-carrera"></span>
                    </div>
                    <div class="form-group">
                        <label for="modalidad">Modalidad de Titulación <span class="required">*</span></label>
                        <div class="select-wrapper">
                            <select id="modalidad" name="modalidad" required>
                                <option value="">— Selecciona una modalidad —</option>
                                <option value="Tesis">Tesis</option>
                                <option value="TSP">Trabajo de Suficiencia Profesional (TSP)</option>
                            </select>
                        </div>
                        <span class="field-error" id="err-modalidad"></span>
                    </div>
                    <div class="form-group">
                        <label for="titulo_trabajo">Título del Trabajo <span class="required">*</span></label>
                        <input type="text" id="titulo_trabajo" name="titulo_trabajo" placeholder="Ingrese el título completo del trabajo" required>
                        <span class="field-error" id="err-titulo_trabajo"></span>
                    </div>
                    <div class="form-group">
                        <label for="asesor">Nombre del Asesor <span class="required">*</span></label>
                        <input type="text" id="asesor" name="asesor" placeholder="Ej: Dr. María Pérez Torres" required>
                        <span class="field-error" id="err-asesor"></span>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">
                    <span class="btn-text">Generar Diploma</span>
                    <span class="btn-icon">→</span>
                    <span class="btn-spinner" style="display:none">⏳</span>
                </button>

            </form>

            <div id="alertBox" class="alert-box" style="display:none"></div>

        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
